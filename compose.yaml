services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: janus_tickets
      POSTGRES_USER: janus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local development}
    ports:
      - "127.0.0.1:${JANUS_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janus -d janus_tickets"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
